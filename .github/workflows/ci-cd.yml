name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/graphql-mcp
    strategy:
      matrix:
        node-version: ["22"]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: mcp/graphql-mcp/package-lock.json

      - name: Install dependencies (clean, from lockfile)
        run: npm ci

      - name: Run unit & integration tests (Jest)
        run: npm test

      - name: Run read-only security test
        run: npm run test:security
